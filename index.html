<!doctype html>
<html lang="en" data-phase="direct" style="--progress: 0">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercury RX · The Hidden Realm</title>
    <meta name="description" content="Is Mercury in the microwave? Enter the Hidden Realm: a pixel-art tracker for Mercury's retrograde and shadow periods.">
    <meta name="theme-color" content="#06030d">
    <link rel="preload" href="/fonts/Jersey10-Regular.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <!-- Every data-slot / data-html is filled at build time (UTC) and again in the browser (local time). -->
    <a class="skip" href="#oracle" data-slot="skip"></a>
    <div class="sky" aria-hidden="true"></div>

    <header class="masthead">
      <h1 class="title" data-slot="site-title"></h1>
      <p class="chip">
        <span class="chip-dot" aria-hidden="true"></span>
        <span class="chip-main" data-slot="chip"></span>
        <span class="chip-sub" data-slot="chip-sub"></span>
      </p>
      <!-- Enabled by JS in PR 4; hidden until then so nobody meets a dead button. -->
      <div class="toggles" role="group" aria-labelledby="toggles-label" hidden>
        <span id="toggles-label" class="visually-hidden" data-slot="toggles-group"></span>
        <button type="button" class="toggle" aria-pressed="false" data-toggle="motion">
          <svg viewBox="0 0 5 5" aria-hidden="true"><path d="M0 0h2v5H0zM3 0h2v5H3z"/></svg>
          <span data-slot="toggle-motion"></span>
        </button>
        <button type="button" class="toggle" aria-pressed="false" data-toggle="contrast">
          <svg viewBox="0 0 6 7" aria-hidden="true"><path d="M2 0h3v1H2zM1 1h2v1H1zM0 2h2v3H0zM1 5h2v1H1zM2 6h3v1H2z"/></svg>
          <span data-slot="toggle-contrast"></span>
        </button>
      </div>
    </header>

    <main class="realm">
      <section class="panel status" aria-labelledby="status-heading">
        <h2 id="status-heading" class="label"><span data-slot="status-heading"></span> · <span data-slot="today"></span></h2>
        <div class="status-row">
          <p class="phase-label" data-slot="phase-label"></p>
          <p class="countdown"><span class="countdown-n" data-slot="countdown-n"></span> <span class="countdown-unit" data-slot="countdown-unit"></span></p>
        </div>
        <div class="track" aria-hidden="true">
          <div class="track-bar">
            <span class="seg" data-seg="preshadow"></span>
            <span class="seg" data-seg="retrograde"></span>
            <span class="seg" data-seg="postshadow"></span>
            <span class="track-marker"></span>
          </div>
          <div class="track-labels">
            <span><span data-slot="track-pre"></span><span class="track-date" data-slot="track-pre-date"></span></span>
            <span><span data-slot="track-rx"></span><span class="track-date" data-slot="track-rx-date"></span></span>
            <span><span data-slot="track-post"></span><span class="track-date" data-slot="track-post-date"></span></span>
          </div>
        </div>
        <p class="status-sub" data-slot="sub"></p>
      </section>

      <section class="orb" aria-labelledby="orb-heading">
        <h2 id="orb-heading" class="visually-hidden" data-slot="orb-heading"></h2>
        <!-- Static frame, mid-backslide. PR 5 animates it when motion is allowed. -->
        <svg class="orb-svg" viewBox="0 0 312 312" role="img" aria-labelledby="orb-alt">
          <title id="orb-alt">Crystal ball: Earth and Mercury both orbit the Sun. A line of sight from Earth through Mercury marks where Mercury appears against the stars; when Mercury laps Earth, that spot slides backward, which is retrograde motion.</title>
          <g class="orb-glass" transform="scale(12)">
            <path class="orb-ball" d="M11 0h4v1h-4zM8 1h10v1H8zM6 2h14v1H6zM5 3h16v1H5zM4 4h18v1H4zM3 5h20v1H3zM2 6h22v2H2zM1 8h24v3H1zM0 11h26v4H0zM1 15h24v3H1zM2 18h22v2H2zM3 20h20v1H3zM4 21h18v1H4zM5 22h16v1H5zM6 23h14v1H6zM8 24h10v1H8zM11 25h4v1h-4z"/>
            <path class="orb-shine" d="M8 2h3v1H8zM6 3h2v1H6zM5 4h2v1H5zM4 5h1v1H4zM3 6h1v2H3zM2 8h1v2H2z"/>
          </g>
          <circle class="ring ring-stars" cx="156" cy="156" r="140"/>
          <circle class="ring ring-mercury" cx="156" cy="156" r="58"/>
          <circle class="ring ring-earth" cx="156" cy="156" r="112"/>
          <path class="sun" d="M144 144h24v24h-24zM150 138h12v36h-12zM138 150h36v12h-36z"/>
          <line class="sightline" x1="189" y1="263" x2="122" y2="20"/>
          <rect class="spark" x="90" y="28" width="4" height="4" opacity=".35"/>
          <rect class="spark" x="104" y="22" width="5" height="5" opacity=".6"/>
          <rect class="spark" x="118" y="16" width="7" height="7"/>
          <rect class="earth" x="178" y="252" width="22" height="22"/>
          <rect class="earth-core" x="185" y="259" width="8" height="8"/>
          <rect class="mercury" x="169" y="203" width="14" height="14"/>
        </svg>
        <p class="orb-status label" data-slot="orb-status"></p>
      </section>

      <section id="oracle" class="panel oracle" aria-labelledby="oracle-heading" tabindex="-1">
        <div class="oracle-top">
          <h2 id="oracle-heading" class="oracle-heading"><span data-slot="oracle-lead"></span><em data-slot="oracle-em"></em>…</h2>
          <span class="label oracle-count" data-slot="oracle-count"></span>
        </div>
        <p class="oracle-card" aria-live="polite" data-slot="oracle-card"></p>
        <!-- Enabled by JS in PR 4. -->
        <div class="choices" hidden>
          <button type="button" class="choice" data-action="heed"><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="heed"></span></button>
          <button type="button" class="choice" data-action="ask"><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="ask-again"></span></button>
        </div>
      </section>

      <section class="panel grimoire" aria-labelledby="grimoire-heading">
        <h2 id="grimoire-heading" class="label" data-slot="grimoire-heading"></h2>
        <dl class="grimoire-list">
          <div><dt data-slot="grimoire-pre"></dt><dd data-slot="pre-shadow-date"></dd></div>
          <div><dt data-slot="grimoire-rx"></dt><dd data-slot="station-rx-date"></dd></div>
          <div><dt data-slot="grimoire-direct"></dt><dd data-slot="station-direct-date"></dd></div>
          <div><dt data-slot="grimoire-post"></dt><dd data-slot="post-shadow-date"></dd></div>
          <div><dt data-slot="grimoire-sign"></dt><dd data-slot="sign"></dd></div>
        </dl>
      </section>

      <section class="panel cycles" aria-labelledby="cycles-heading">
        <h2 id="cycles-heading" class="label" data-slot="cycles-heading"></h2>
        <ul class="candles" data-html="candles"></ul>
      </section>
    </main>

    <footer class="footer">
      <p data-slot="disclaimer"></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
