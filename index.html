<!doctype html>
<html lang="en" data-phase="direct" style="--progress: 0">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mercury RX · The Hidden Realm</title>
    <meta name="description" content="Is Mercury in the microwave? Enter the Hidden Realm: a pixel-art tracker for Mercury's retrograde and shadow periods.">
    <meta name="theme-color" content="#06030d">
    <link rel="canonical" href="https://rx.chibimuere.com/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- Link previews. og.png is rendered from today's sky at build time (scripts/og.ts); ?v= is the build date. -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rx.chibimuere.com/">
    <meta property="og:title" content="Mercury RX · The Hidden Realm">
    <meta property="og:description" content="Is Mercury in the microwave? Enter the Hidden Realm: a pixel-art tracker for Mercury's retrograde and shadow periods.">
    <meta property="og:image" content="https://rx.chibimuere.com/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Mercury RX, The Hidden Realm: this week's Mercury phase beside a pixel-art scrying orb.">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Applies saved (or OS) contrast and motion prefs, and whether you've peered into the orb, before first paint. Same rules as src/prefs.ts and src/veil.ts. -->
    <script>(function(){var d=document.documentElement,p={};try{p=JSON.parse(localStorage.getItem('mrx:prefs'))||{}}catch(e){}var m=function(q){return matchMedia(q).matches};if(p.hc!=null?p.hc:m('(prefers-contrast: more)'))d.dataset.theme='hc';d.dataset.motion=(p.still!=null?p.still:m('(prefers-reduced-motion: reduce)'))?'off':'on';var v='on';try{if(localStorage.getItem('mrx:peered'))v='off'}catch(e){}d.dataset.veil=v})()</script>
  </head>
  <body>
    <!-- Every data-slot / data-html is filled at build time (UTC) and again in the browser (local time). -->
    <a class="skip" href="#oracle" data-slot="skip"></a>
    <div class="sky" aria-hidden="true"><span class="stars stars-a"></span><span class="stars stars-b"></span><span class="stars stars-c"></span></div>

    <header class="masthead">
      <h1 class="title"><span class="title-main" data-slot="site-title-main"></span><span class="visually-hidden"> · </span><span class="title-sub" data-slot="site-title-sub"></span></h1>
      <p class="chip">
        <span class="chip-dot" aria-hidden="true"></span>
        <span class="chip-main" data-slot="chip"></span>
        <span class="chip-sub" data-slot="chip-sub"></span>
      </p>
      <!-- Shown by JS (src/prefs.ts) so nobody meets a dead button. -->
      <div class="toggles" role="group" aria-labelledby="toggles-label" hidden>
        <span id="toggles-label" class="visually-hidden" data-slot="toggles-group"></span>
        <button type="button" class="toggle" aria-pressed="false" data-toggle="motion">
          <svg viewBox="0 0 5 5" aria-hidden="true"><path d="M0 0h2v5H0zM3 0h2v5H3z"/></svg>
          <span data-slot="toggle-motion"></span>
        </button>
        <button type="button" class="toggle" aria-pressed="false" data-toggle="contrast">
          <svg viewBox="0 0 6 7" aria-hidden="true"><path d="M2 0h3v1H2zM1 1h2v1H1zM0 2h2v3H0zM1 5h2v1H1zM2 6h3v1H2z"/></svg>
          <span data-slot="toggle-contrast"></span>
        </button>
      </div>
    </header>

    <main class="realm">
      <section class="panel status" aria-labelledby="status-heading">
        <h2 id="status-heading" class="label"><span data-slot="status-heading"></span> · <span data-slot="today"></span></h2>
        <div class="status-row">
          <p class="phase-label" data-slot="phase-label"></p>
          <p class="countdown"><span class="countdown-n" data-slot="countdown-n"></span> <span class="countdown-unit" data-slot="countdown-unit"></span></p>
        </div>
        <div class="track" aria-hidden="true">
          <div class="track-bar">
            <span class="seg" data-seg="preshadow"></span>
            <span class="seg" data-seg="retrograde"></span>
            <span class="seg" data-seg="postshadow"></span>
            <span class="track-marker"></span>
          </div>
          <div class="track-labels">
            <span><span data-slot="track-pre"></span><span class="track-date" data-slot="track-pre-date"></span></span>
            <span><span data-slot="track-rx"></span><span class="track-date" data-slot="track-rx-date"></span></span>
            <span><span data-slot="track-post"></span><span class="track-date" data-slot="track-post-date"></span></span>
          </div>
        </div>
        <p class="status-sub" data-slot="sub"></p>
      </section>

      <section class="orb" aria-labelledby="orb-heading">
        <h2 id="orb-heading" class="visually-hidden" data-slot="orb-heading"></h2>
        <!-- The veil: the science first. Plain text without JS; with JS it clouds the orb until you peer in (src/veil.ts). -->
        <div class="veil">
          <div class="veil-mist" aria-hidden="true"></div>
          <section class="veil-card" aria-labelledby="veil-heading">
            <h3 id="veil-heading" class="veil-title" tabindex="-1" data-slot="veil-title"></h3>
            <!-- Closing the card is peering in too (same button behaviour, src/veil.ts). -->
            <button type="button" class="veil-close" data-action="peer" hidden><svg viewBox="0 0 7 7" aria-hidden="true"><path d="M0 0h2v1H0zM1 1h2v1H1zM2 2h3v1H2zM3 3h1v1H3zM2 4h3v1H2zM1 5h2v1H1zM0 6h2v1H0zM5 0h2v1H5zM4 1h2v1H4zM4 5h2v1H4zM5 6h2v1H5z"/></svg><span class="visually-hidden" data-slot="veil-close"></span></button>
            <p class="veil-why" data-slot="veil-why"></p>
            <p class="label veil-inside" data-slot="veil-inside"></p>
            <ul class="veil-legend">
              <li><span class="sw sw-sun" aria-hidden="true"></span><span data-slot="veil-sun"></span></li>
              <li><span class="sw sw-mercury" aria-hidden="true"></span><span data-slot="veil-mercury"></span></li>
              <li><span class="sw sw-earth" aria-hidden="true"></span><span data-slot="veil-earth"></span></li>
              <li><span class="sw sw-sight" aria-hidden="true"></span><span data-slot="veil-sight"></span></li>
              <li><span class="sw sw-spark" aria-hidden="true"></span><span data-slot="veil-spark"></span></li>
            </ul>
            <button type="button" class="veil-cta" data-action="peer" hidden><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="veil-cta"></span></button>
          </section>
        </div>
        <!-- The realm gate: arch, pedestal and candles are decoration (hidden in high contrast). -->
        <div class="orb-stage">
          <svg class="gate" viewBox="0 0 24 26" aria-hidden="true"><path class="gate-rim" d="M10 0h4v1h-4zM7 1h10v1h-10zM5 2h14v1h-14zM4 3h16v1h-16zM3 4h18v1h-18zM2 5h20v2h-20zM1 7h22v3h-22zM0 10h24v16h-24z"/><path class="gate-void" transform="translate(1 1) scale(0.9167 0.96)" d="M10 0h4v1h-4zM7 1h10v1h-10zM5 2h14v1h-14zM4 3h16v1h-16zM3 4h18v1h-18zM2 5h20v2h-20zM1 7h22v3h-22zM0 10h24v16h-24z"/><path class="gate-stars" d="M6 5h.4v.4h-.4zM17 4h.4v.4h-.4zM4 12h.4v.4h-.4zM19 10h.4v.4h-.4zM12 2.4h.4v.4h-.4zM21 17h.4v.4h-.4zM3 20h.4v.4h-.4z"/></svg>
          <div class="orb-float">
            <!-- Baked at build time, re-drawn for the visitor's now, animated when motion is on (src/motion.ts). -->
            <svg class="orb-svg" viewBox="0 0 312 312" role="img" aria-labelledby="orb-alt" tabindex="-1">
              <title id="orb-alt">Crystal ball: Earth and Mercury both orbit the Sun. A line of sight from Earth through Mercury marks where Mercury appears against the stars; when Mercury laps Earth, that spot slides backward, which is retrograde motion.</title>
              <g class="orb-glass" transform="scale(12)">
                <path class="orb-ball" d="M11 0h4v1h-4zM8 1h10v1H8zM6 2h14v1H6zM5 3h16v1H5zM4 4h18v1H4zM3 5h20v1H3zM2 6h22v2H2zM1 8h24v3H1zM0 11h26v4H0zM1 15h24v3H1zM2 18h22v2H2zM3 20h20v1H3zM4 21h18v1H4zM5 22h16v1H5zM6 23h14v1H6zM8 24h10v1H8zM11 25h4v1h-4z"/>
                <path class="orb-shine" d="M8 2h3v1H8zM6 3h2v1H6zM5 4h2v1H5zM4 5h1v1H4zM3 6h1v2H3zM2 8h1v2H2z"/>
              </g>
              <circle class="ring ring-stars" cx="156" cy="156" r="140"/>
              <circle class="ring ring-earth" cx="156" cy="156" r="112"/>
              <path class="sun" d="M144 144h24v24h-24zM150 138h12v36h-12zM138 150h36v12h-36z"/>
              <!-- Mercury's true orbit, sightline and sprites at today's real positions (src/orbit.ts). -->
              <g class="orb-sky" data-html="orb-sky"></g>
            </svg>
          </div>
          <svg class="pedestal" viewBox="0 0 10 3" aria-hidden="true"><path class="pedestal-stone" d="M2 0h6v1h-6zM1 1h8v1h-8zM0 2h10v1h-10z"/><path class="pedestal-glow" d="M2 0h6v.4h-6z"/></svg>
          <div class="gate-candles gate-candles-l" aria-hidden="true"><svg class="candle-sprite big" viewBox="0 0 5 10"><g class="flame"><path class="flame-edge" d="M2 0h1v1h-1zM1 1h1v2h-1zM3 1h1v2h-1z"/><path class="flame-core" d="M2 1h1v2h-1z"/></g><path class="wax wax-a" d="M0 4h5v6h-5z"/><path class="wax-rim" d="M0 4h5v1h-5z"/></svg><svg class="candle-sprite small d2" viewBox="0 0 5 10"><g class="flame"><path class="flame-edge" d="M2 0h1v1h-1zM1 1h1v2h-1zM3 1h1v2h-1z"/><path class="flame-core" d="M2 1h1v2h-1z"/></g><path class="wax wax-b" d="M0 4h5v6h-5z"/><path class="wax-rim" d="M0 4h5v1h-5z"/></svg></div>
          <div class="gate-candles gate-candles-r" aria-hidden="true"><svg class="candle-sprite small d3" viewBox="0 0 5 10"><g class="flame"><path class="flame-edge" d="M2 0h1v1h-1zM1 1h1v2h-1zM3 1h1v2h-1z"/><path class="flame-core" d="M2 1h1v2h-1z"/></g><path class="wax wax-b" d="M0 4h5v6h-5z"/><path class="wax-rim" d="M0 4h5v1h-5z"/></svg><svg class="candle-sprite big" viewBox="0 0 5 10"><g class="flame"><path class="flame-edge" d="M2 0h1v1h-1zM1 1h1v2h-1zM3 1h1v2h-1z"/><path class="flame-core" d="M2 1h1v2h-1z"/></g><path class="wax wax-a" d="M0 4h5v6h-5z"/><path class="wax-rim" d="M0 4h5v1h-5z"/></svg></div>
        </div>
        <!-- The visible caption follows the animation's simulated date; screen readers get the real status below. -->
        <p class="orb-status label" aria-hidden="true"><span class="orb-date" data-slot="orb-date" data-orb="date"></span><span data-slot="orb-status" data-orb="status"></span></p>
        <p class="visually-hidden" data-slot="orb-status"></p>
        <button type="button" class="veil-reopen" data-action="unpeer" hidden><span data-slot="veil-reopen"></span></button>
      </section>

      <section id="oracle" class="panel oracle" aria-labelledby="oracle-heading" tabindex="-1">
        <div data-view="oracle">
          <div class="oracle-top">
            <h2 id="oracle-heading" class="oracle-heading"><span data-slot="oracle-lead"></span><em data-slot="oracle-em"></em>…</h2>
            <span class="label oracle-count" data-slot="oracle-count"></span>
          </div>
          <p class="oracle-card" aria-live="polite" data-slot="oracle-card"></p>
          <!-- Shown by JS (src/oracle.ts). -->
          <div class="choices" hidden>
            <button type="button" class="choice" data-action="heed"><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="heed"></span></button>
            <button type="button" class="choice" data-action="ask"><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="ask-again"></span></button>
          </div>
        </div>

        <!-- Heed the stars: the phase's checklist. Needs JS to keep ticks, so it starts hidden. -->
        <div data-view="checklist" hidden>
          <div class="oracle-top">
            <h2 id="checklist-heading" class="oracle-heading" tabindex="-1" data-slot="checklist-title"></h2>
            <span class="tip">
              <!-- Shown by CSS once every box is ticked. -->
              <span class="label quest-badge"><svg viewBox="0 0 5 5" aria-hidden="true"><path d="M2 0h1v5H2zM0 2h5v1H0z"/></svg><span data-slot="quest-badge"></span></span>
              <span class="label oracle-count" aria-live="polite" data-slot="checklist-count"></span>
              <button type="button" class="tip-btn" aria-expanded="false" aria-controls="why-tip">
                <!-- A solid pixel disc with the "i" knocked out, so it reads at 18px. -->
                <svg viewBox="0 0 9 9" aria-hidden="true"><path d="M2 0h5v1H2zM1 1h7v1H1zM0 2h4v1H0zM5 2h4v1H5zM0 3h9v1H0zM0 4h3v1H0zM5 4h4v1H5zM0 5h4v1H0zM5 5h4v1H5zM0 6h3v1H0zM6 6h3v1H6zM1 7h7v1H1zM2 8h5v1H2z"/></svg>
                <span class="visually-hidden" data-slot="why-label"></span>
              </button>
            </span>
          </div>
          <p id="why-tip" class="tip-text" hidden data-slot="why-no-reset"></p>
          <ul class="checklist" data-html="checklist"></ul>
          <div class="choices">
            <button type="button" class="choice" data-action="back"><svg class="cur" viewBox="0 0 3 5" aria-hidden="true"><path d="M0 0h1v5H0zM1 1h1v3H1zM2 2h1v1H2z"/></svg><span data-slot="return"></span></button>
          </div>
        </div>
      </section>

      <section class="panel grimoire" aria-labelledby="grimoire-heading">
        <h2 id="grimoire-heading" class="label" data-slot="grimoire-heading"></h2>
        <dl class="grimoire-list">
          <div><dt data-slot="grimoire-pre"></dt><dd data-slot="pre-shadow-date"></dd></div>
          <div><dt data-slot="grimoire-rx"></dt><dd data-slot="station-rx-date"></dd></div>
          <div><dt data-slot="grimoire-direct"></dt><dd data-slot="station-direct-date"></dd></div>
          <div><dt data-slot="grimoire-post"></dt><dd data-slot="post-shadow-date"></dd></div>
          <div><dt data-slot="grimoire-sign"></dt><dd data-slot="sign"></dd></div>
        </dl>
      </section>

      <section class="panel cycles" aria-labelledby="cycles-heading">
        <h2 id="cycles-heading" class="label" data-slot="cycles-heading"></h2>
        <ul class="candles" data-html="candles"></ul>
      </section>
    </main>

    <!-- Easter eggs speak here (src/egg-show.ts). -->
    <p class="visually-hidden" aria-live="polite" data-egg-announce></p>

    <footer class="footer">
      <p data-slot="disclaimer"></p>
      <p class="credit"><span data-slot="footer-year"></span> <a href="https://chibimuere.com" data-slot="footer-name"></a> · <span data-slot="footer-collab"></span></p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
